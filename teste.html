    <div id="container" style="padding: 20px; text-align: center; border: 2px solid #ccc;">
        <h1 id="titulo">O que vai acontecer?</h1>
        <input type="text" id="campoTexto" placeholder="Digite 'rj', 'sp', 'mg' ou 'es'">
        <button onclick="verificar()">Executar</button>
    </div>
<script>
        function verificar() {
            const input = document.getElementById('campoTexto').value.toLowerCase();
            const titulo = document.getElementById('titulo');
            const corpo = document.body;

            if (input === 'rj') {
                titulo.innerText = "Bem vindo ao Rio de Janeiro! ☀️";
                corpo.style.backgroundColor = "#2c3e50";
                corpo.style.color = "#87ceeb";

            } else if (input === 'sp') {
                titulo.innerText = "Bem vindo a São Paulo! 🏙️";
                corpo.style.backgroundColor = "#95a5a6";
                corpo.style.color = "black";

            } else if (input === 'mg') {
                titulo.innerText = "Bem vindo a Minas Gerais! 🧀";
                corpo.style.backgroundColor = "#f1c40f";
                corpo.style.color = "black";

            } else if (input === 'es') {
                titulo.innerText = "Bem vindo ao Espírito Santo! 🌴";
                corpo.style.backgroundColor = "#27ae60";
                corpo.style.color = "black";

            } else {
                titulo.innerText = "Comando desconhecido... 🤔";
                corpo.style.backgroundColor = "white";
                corpo.style.color = "black";
         }
        }
